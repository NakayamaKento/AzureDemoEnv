<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Group SLI Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d252c;
      --muted: #5c6975;
      --line: #d5dde5;
      --panel: #ffffff;
      --canvas: #f4f7f8;
      --accent: #0d7f7a;
      --accent-strong: #075e5b;
      --warn: #b56b00;
      --bad: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Aptos", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(13, 127, 122, 0.14), rgba(39, 86, 120, 0.08)),
        var(--canvas);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
    }

    .status {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 16px;
    }

    section {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .mode-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    button.active {
      color: #fff;
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    pre {
      min-height: 240px;
      margin: 0;
      overflow: auto;
      padding: 14px;
      border-radius: 8px;
      color: #e7f6f4;
      background: #172126;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    @media (max-width: 780px) {
      header,
      .grid,
      .mode-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Service Group SLI Demo</h1>
        <p>注文 API、queue worker、Cosmos DB、Storage を使った小さなサービスを動かし、Service Group、Health Model、SLI の見え方を確認します。</p>
      </div>
      <div class="status" id="status">Loading...</div>
    </header>

    <div class="grid">
      <section>
        <h2>Fault Mode</h2>
        <div class="mode-list" id="modes"></div>
        <div class="actions">
          <button class="primary" id="createOrder">注文を 1 件送信</button>
          <button id="runTraffic">デモトラフィックを生成</button>
          <button id="refresh">状態を更新</button>
        </div>
      </section>
      <section>
        <h2>Response</h2>
        <pre id="output">{}</pre>
      </section>
    </div>
  </main>

  <script>
    const output = document.querySelector('#output');
    const statusPanel = document.querySelector('#status');
    const modesPanel = document.querySelector('#modes');
    let currentMode = 'none';

    function write(data) {
      output.textContent = JSON.stringify(data, null, 2);
    }

    async function api(path, options) {
      const response = await fetch(path, {
        headers: { 'content-type': 'application/json' },
        ...options
      });
      const body = await response.json();
      return { status: response.status, body };
    }

    async function refresh() {
      const faults = await api('/api/faults');
      const health = await api('/healthz');
      currentMode = faults.body.mode;
      statusPanel.innerHTML = `<strong>${health.body.status}</strong><br>fault mode: ${currentMode}<br>${health.body.timestamp}`;
      renderModes(faults.body.allowedModes || []);
      write({ faults: faults.body, health: health.body });
    }

    function renderModes(modes) {
      modesPanel.innerHTML = '';
      modes.forEach((mode) => {
        const button = document.createElement('button');
        button.textContent = mode;
        button.className = mode === currentMode ? 'active' : '';
        button.addEventListener('click', async () => {
          const result = await api('/api/faults', {
            method: 'POST',
            body: JSON.stringify({ mode })
          });
          write(result.body);
          await refresh();
        });
        modesPanel.appendChild(button);
      });
    }

    document.querySelector('#createOrder').addEventListener('click', async () => {
      const result = await api('/api/orders', {
        method: 'POST',
        body: JSON.stringify({ customerId: 'portal-demo' })
      });
      write(result);
    });

    document.querySelector('#runTraffic').addEventListener('click', async () => {
      const result = await api('/api/demo/run', {
        method: 'POST',
        body: JSON.stringify({ count: 10 })
      });
      write(result);
    });

    document.querySelector('#refresh').addEventListener('click', refresh);
    refresh().catch((error) => write({ error: error.message }));
  </script>
</body>
</html>
