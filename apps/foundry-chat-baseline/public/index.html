<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundry Chat Baseline</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2a37;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-2: #115e59;
        --border: #d1d5db;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
        background: radial-gradient(circle at top right, #dbeafe, var(--bg));
        color: var(--text);
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .chat {
        width: min(920px, 100%);
        height: min(82vh, 780px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(15, 118, 110, 0.15);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .head h1 {
        margin: 0;
        font-size: 18px;
      }

      .head small {
        color: var(--muted);
      }

      .messages {
        padding: 20px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg {
        max-width: 78%;
        line-height: 1.5;
        padding: 10px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
      }

      .msg.user {
        align-self: flex-end;
        background: #dcfce7;
        border: 1px solid #86efac;
      }

      .msg.bot {
        align-self: flex-start;
        background: #ecfeff;
        border: 1px solid #99f6e4;
      }

      .composer {
        border-top: 1px solid var(--border);
        padding: 14px;
        display: flex;
        gap: 10px;
      }

      textarea {
        flex: 1;
        resize: vertical;
        min-height: 48px;
        max-height: 160px;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px;
        font: inherit;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 0 18px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-2);
      }

      @media (max-width: 700px) {
        .chat {
          height: 90vh;
        }

        .msg {
          max-width: 92%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="chat">
        <div class="head">
          <h1>Foundry Chat Baseline</h1>
          <small id="status">ready</small>
        </div>
        <div id="messages" class="messages"></div>
        <form id="form" class="composer">
          <textarea id="input" placeholder="メッセージを入力"></textarea>
          <button type="submit">送信</button>
        </form>
      </div>
    </div>

    <script>
      const messages = document.getElementById('messages');
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const status = document.getElementById('status');
      let conversationId = null;

      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = '';
        status.textContent = 'sending...';

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, conversationId })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'request failed');
          }

          conversationId = data.conversationId || conversationId;
          addMessage('bot', data.answer || '(empty)');
          status.textContent = 'ready';
        } catch (error) {
          addMessage('bot', `エラー: ${error.message}`);
          status.textContent = 'error';
        }
      });

      addMessage('bot', 'Foundry チャットへようこそ。質問を入力してください。');
    </script>
  </body>
</html>
