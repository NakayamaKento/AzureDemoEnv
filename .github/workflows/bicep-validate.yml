name: bicep-validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.bicep'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep CLI セットアップ
        run: az bicep install
      - name: Bicep ファイル検証
        run: |
          files=$(find . -name "*.bicep")
          if [ -z "$files" ]; then
            echo "No bicep files"
            exit 0
          fi
          for f in $files; do
            echo "Validating $f"
            az bicep build --file "$f"
          done
