#cloud-config
package_update: true
packages:
  - docker.io
write_files:
  - path: /etc/prometheus/prometheus.yml
    owner: root:root
    permissions: '0644'
    content: |
      global:
        scrape_interval: 30s
        evaluation_interval: 30s
        external_labels:
          environment: service-group-sli-demo
      rule_files:
        - /etc/prometheus/sli-rules.yml
      scrape_configs:
        - job_name: order-api
          scheme: https
          metrics_path: /metrics
          static_configs:
            - targets:
                - __API_HOST__
      remote_write:
        - url: '__METRICS_INGESTION_ENDPOINT__'
          azuread:
            cloud: AzurePublic
            managed_identity:
              client_id: '__MANAGED_IDENTITY_CLIENT_ID__'
  - path: /etc/prometheus/sli-rules.yml
    owner: root:root
    permissions: '0644'
    content: |
      groups:
        - name: order-availability-sli
          interval: 1m
          rules:
            - record: order_sli_good_requests_1m
              expr: sum by (job) (increase(orders_submitted_total{job="order-api"}[1m]))
            - record: order_sli_failed_requests_1m
              expr: sum by (job) (increase(order_submit_failures_total{job="order-api"}[1m]))
  - path: /etc/systemd/system/prometheus.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Prometheus collector for Azure Monitor Workspace
      Wants=network-online.target docker.service
      After=network-online.target docker.service

      [Service]
      Restart=always
      RestartSec=10
      ExecStartPre=-/usr/bin/docker rm prometheus
      ExecStartPre=/usr/bin/docker pull quay.io/prometheus/prometheus:v3.5.0
      ExecStart=/usr/bin/docker run --name prometheus --network host --volume /etc/prometheus:/etc/prometheus:ro --volume prometheus-data:/prometheus quay.io/prometheus/prometheus:v3.5.0 --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=2d --web.listen-address=127.0.0.1:9090
      ExecStop=/usr/bin/docker stop prometheus

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl enable --now docker
  - systemctl daemon-reload
  - systemctl enable --now prometheus